name: terraform-apply

# push to dev  -> apply to the dev environment
# push to main -> apply to the prod environment (merge of the dev -> main PR)
on:
  push:
    branches: [dev, main]

permissions:
  contents: read
  id-token: write # OIDC login to AWS

concurrency:
  group: terraform-apply-${{ github.ref_name }}
  cancel-in-progress: false # never kill an apply mid-run

jobs:
  apply:
    runs-on: ubuntu-latest
    # `environment` can't read env vars, so the branch -> env mapping is written twice
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::009377924228:role/didier-lakehouse-github-actions
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - run: terraform init -input=false -backend-config=environments/$ENV/backend.hcl
      - run: terraform apply -input=false -auto-approve -var-file=environments/$ENV/terraform.tfvars
